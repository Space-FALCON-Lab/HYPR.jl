name: HYPR CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        threads: [1, 4]
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
      JULIA_LOAD_PATH: '@:@stdlib'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - run: julia --project=. -e 'using Pkg; Pkg.precompile(["HYPR"]; strict=true)'
      - run: julia --compiled-modules=strict --pkgimages=existing --project=. test/precompiled_loading.jl core
      - run: julia --project=. examples/bounded_search.jl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify arithmetic mutation controls
        run: python3 test/run_mutation_controls.py
      - name: Verify coverage gate failure cases
        run: python3 test/test_coverage_gate.py
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - run: julia --project=docs -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - run: julia --project=docs docs/make.jl
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/build/
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        order: [core-first, hypr-first]
    env:
      JULIA_NUM_THREADS: '4'
      JULIA_LOAD_PATH: '@:@stdlib'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Space-FALCON-Lab/SpaceAGORA.jl
          # Reviewed service-provider commit; publish it before enabling release CI.
          ref: 8a979873ad0ed17045a9080347b13f944c176079
          path: .integration-spaceagora
          lfs: false
          sparse-checkout: |
            src
            ext
            test
            packages/SpaceAGORAHYPR
            scripts
            Project.toml
            Manifest.toml
          sparse-checkout-cone-mode: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install isolated integration environment
        run: |
          julia --startup-file=no test/setup_integration.jl .integration-spaceagora .integration-env
          julia --startup-file=no -e 'using Pkg; Pkg.activate(".coverage-core"); Pkg.develop(path=pwd())'
      - name: Precompile core, extension and compatibility shim
        run: julia --project=.integration-env -e 'using Pkg; Pkg.precompile(["SpaceAGORA", "HYPR", "SpaceAGORAHYPR"]; strict=true)'
      - name: Verify compiled loading and refusal
        run: |
          julia --compiled-modules=strict --pkgimages=existing --project=.integration-env test/precompiled_loading.jl ${{ matrix.order }}
          julia --compiled-modules=strict --pkgimages=existing --project=.integration-env test/precompiled_loading.jl shim-first
          julia --compiled-modules=strict --pkgimages=existing --project=.integration-env test/precompiled_conflicts.jl conflict-first
          julia --compiled-modules=strict --pkgimages=existing --project=.integration-env test/precompiled_conflicts.jl hypr-first
      - name: Verify incompatible resolution
        run: julia --project=.integration-env test/incompatible_resolution.jl .integration-spaceagora
      - uses: actions/checkout@v7
        with:
          repository: Space-FALCON-Lab/SpaceAGORA.jl
          ref: fa2e4a411c16c0587230b2020881a36065887b07
          path: .comparison-source
          lfs: false
          sparse-checkout: SpaceAGORA_RL.jl/src
      - name: Verify pinned original and retimed-fuel comparison routes
        run: julia --project=.integration-env test/jakob_comparison.jl .comparison-source/SpaceAGORA_RL.jl/src
      - name: Run adapter without the compatibility shim
        run: julia --project=.integration-env test/integration.jl ${{ matrix.order }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Measure all moved code and enforce 90/80 coverage
        if: matrix.order == 'core-first'
        run: python3 scripts/run_coverage.py --core-project "$PWD/.coverage-core" --integration-project "$PWD/.integration-env" --output "$RUNNER_TEMP/hypr-coverage"
      - name: Retain coverage report and stage exits
        if: always() && matrix.order == 'core-first'
        uses: actions/upload-artifact@v4
        with:
          name: hypr-coverage
          path: ${{ runner.temp }}/hypr-coverage/
          if-no-files-found: error
