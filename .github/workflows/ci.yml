name: HYPR CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        threads: [1, 4]
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
      JULIA_LOAD_PATH: '@:@stdlib'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - run: julia --project=. examples/bounded_search.jl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify arithmetic mutation controls
        run: python3 test/run_mutation_controls.py
      - name: Verify coverage gate failure cases
        run: python3 test/test_coverage_gate.py
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - run: julia --project=docs -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - run: julia --project=docs docs/make.jl
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/build/
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        order: [core-first, hypr-first]
    env:
      JULIA_NUM_THREADS: '4'
      JULIA_LOAD_PATH: '@:@stdlib'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Space-FALCON-Lab/SpaceAGORA.jl
          # Reviewed contract candidate. R5 must publish/replace this identity
          # with the supported immutable pair before release CI can run.
          ref: a6899166c705603f94198d007309d783342b963c
          path: .integration-spaceagora
          lfs: false
          sparse-checkout: |
            src
            ext
            test
            packages/SpaceAGORAHYPR
            Project.toml
            Manifest.toml
          sparse-checkout-cone-mode: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install isolated integration environment
        run: |
          julia --startup-file=no test/setup_integration.jl .integration-spaceagora .integration-env
          julia --startup-file=no -e 'using Pkg; Pkg.activate(".coverage-core"); Pkg.develop(path=pwd())'
      - name: Run adapter without the compatibility shim
        run: julia --project=.integration-env test/integration.jl ${{ matrix.order }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Measure all moved code and enforce 90/80 coverage
        if: matrix.order == 'core-first'
        run: python3 scripts/run_coverage.py --core-project "$PWD/.coverage-core" --integration-project "$PWD/.integration-env" --output "$RUNNER_TEMP/hypr-coverage"
      - name: Retain coverage report and stage exits
        if: always() && matrix.order == 'core-first'
        uses: actions/upload-artifact@v4
        with:
          name: hypr-coverage
          path: ${{ runner.temp }}/hypr-coverage/
          if-no-files-found: error
